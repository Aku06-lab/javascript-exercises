<!DOCTYPE html>
<html>
    <header>
        <title>myToDoApp</title>
        <meta charset="utf-8">
    </header>
    <body>
        <header> 
            <button class="menu">☰</button>
            <h1>MissBehave's ToDo</h1>
        </header>
        <main>
           
            <aside class="sidebar">
                <div class="taskButtons">
                    <button class="addProject"> ＋ ADD PROJECT</button>
                    <button class="addTask"> ＋ ADD TASK</button>
                </div>
                <div class="tasks">
                    <h1>Tasks</h1>
                    <button class="allTasks">All Tasks</button>
                    <button class="todays">Today</button>
                    <button class="priorityWork">Deadline</button>
                    <button class="completed">Completed</button>
                </div>
                <div class="projects">
                    <h1>Projects </h1>
                    
                </div>
               
                <!-- <div class="general">
                    <h1>General <button class="generalTask"> ＋</button></h1>
                </div> -->
            
            </aside>
            <div class="sectionContent">                
                <section class="content">
                
                </section>
            </div>
            
            <form class="todoForm">
                <h1> Add Task </h1>
                <div>
                    <label for="project">Project:</label>
                    <select id="project"></select>

                    <label for="title"> Title*: </label>
                    <input type="text" id="title"  required>

                    <label for="desc">Description:</label>
                    <textarea id="desc"></textarea>

                    <label for="duedate"> Due Date : </label>
                    <input type="date" id="duedate">

                    <label for="priority"> priority: </label>
                    <select id="priority" name="priority">
                        <option value="low"> Low </option>
                        <option value="medium"> Medium </option>
                        <option value="high"> High</option>
                    </select>

                    <label for="notes">Notes:</label>
                    <textarea id="notes"></textarea>
                </div>


                <div class="completedButton">
                    <label for="completed"> Completed</label>
                    <input type="checkbox" id="completed" value="completed">
                </div>
                <div class="addCancel">
                    <button type="submit"> Add </button>
                    <button type="button" id="cancel">Cancel</button>
                </div>

            </form>
            <form class="projectForm">
                <div class="projecttitle">
                    <label for="projectTitle"> Project Title*: </label>
                    <input type="text" id="projectTitle" required>

                </div>

                <div class="addCancelProject">
                    <button type="submit"> Add </button>
                    <button type="button" id="cancelProject">Cancel</button>
                </div>

            </form>
        </main>
    </body>
</html>
