<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <header><h1>CALCULATOR</h1></header>
            <section>
                <div class="calculatorBody">
                    <div>
                        <input id="display">
                    </div>
                    
                    <div class="numberButtons">
                        <div>
                            <button class="digit">7</button>
                            <button class="digit">8</button>
                            <button class="digit">9</button>
                            <button class="operation" id="divide">/</button>
                        </div>
                        <div>
                            <button class="digit">4</button>
                            <button class="digit">5</button>
                            <button class="digit">6</button>
                            <button class="operation" id="multiply">*</button>
                        </div>
                        <div>
                            <button class="digit">1</button>
                            <button class="digit">2</button>
                            <button class="digit">3</button>
                            <button class="operation" id="minus">-</button>                        
                        </div>
                        <div>
                            <button class="dot">.</button>
                            <button class="digit">0</button>
                            <button id="equalsToo">=</button>
                            <button class="operation" id="plus">+</button>
                        </div>
                    
                    </div>
                    <div class="buttonsClear">
                        <button class="clear" style="background-color: cadetblue;">Clear</button>
                        <button class="delete" style="background-color:darksalmon;">Delete</button>
                    </div>
                </div>
                


            </section>
            
        </div>
        <script src="script.js" ></script>

    </body>
</html>
