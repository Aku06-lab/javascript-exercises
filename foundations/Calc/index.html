<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>calculator</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="container">
            <header><h1>CALCULATOR</h1></header>
            <section>
                <div class="calculatorBody">
                    <div>
                        <input>
                    </div>
                    
                    <div class="numberButtons">
                        <div>
                            <button class="seven">7</button>
                            <button class="eight">8</button>
                            <button class="nine">9</button>
                            <button class="operation" id="divide">÷</button>
                        </div>
                        <div>
                            <button class="four">4</button>
                            <button class="five">5</button>
                            <button class="six">6</button>
                            <button class="operation" id="multiply">x</button>
                        </div>
                        <div>
                            <button class="one">1</button>
                            <button class="two">2</button>
                            <button class="three">3</button>
                            <button class="operation" id="minus">-</button>                        
                        </div>
                        <div>
                            <button class="dot">.</button>
                            <button class="zero">0</button>
                            <button class="operation" id="equalsTo">=</button>
                            <button class="operation" id="plus">+</button>
                        </div>
                    
                    </div>
                    <div class="buttonsClear">
                        <button class="clear" style="background-color: cadetblue;">Clear</button>
                        <button class="delete" style="background-color:darksalmon;">Delete</button>
                    </div>
                </div>
                


            </section>
            
        </div>

    </body>
</html>
