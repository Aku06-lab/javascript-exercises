<!DOCTYPE html>
<html>

<head>
    <title> rock paper scissors game</title>
    </head>
    <body>
        <script>
            let humanScore = 0;
            let computerScore = 0;

            const choices = ["rock", "paper", "scissors"];

            function computerChoice(computer_choice) {
                const index = Math.floor(Math.random() * computer_choice.length);
                return computer_choice[index];

            }

            function humanChoice() {

                const human_choice = prompt("please enter ur choice");

                if (human_choice === "rock" ||
                    human_choice === "paper" ||
                    human_choice === "scissors"
                ) {

                    alert("choice accepted")
                    return human_choice;

                }
                else {
                    alert("please enter a valid choice");
                    return null;
                }
            }

            function playRound(human_choice, computer_choice){

                if (human_choice === computer_choice)  {
                    console.log("Round draw");
                }
                
                if(
                    (human_choice === "rock" && computer_choice === "scissors") ||
                    (human_choice === "scissors" && computer_choice === "paper") ||
                    (human_choice === "paper" && computer_choice === "rock")
                ) {
                    humanScore++;
                
                }
                else {
                    computerScore++
                }

                console.log("players score", humanScore);
                console.log("computer score", computerScore);

            }

            function playGame(){

                for(let i=1; i<5 ; i++){
                    alert("round" + i);
                    const human_choice = humanChoice();
                    const computer_choice = computerChoice(choices);

                    playRound(human_choice, computer_choice)
                }

                if (humanScore > computerScore) {
                    alert("you win the game" + humanScore + "-" + computerScore);

                } else if(computerScore > humanScore){
                    alert("computer win the game" + humanScore + "-" + computerScore);
                } else {
                    alert("The game is a draw" + humanScore + "-" + computerScore);
                }

            }
            
            playGame()

            
        </script>

    </body>
</html>
